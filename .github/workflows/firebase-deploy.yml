
name: Deploy Firestore Rules

on:
  push:
    branches:
      - withdrawal-safety-fix
    paths:
      - "firestore.rules"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require reviewed rules files
        run: |
          if [ ! -f firestore.rules ]; then
            echo "::error::firestore.rules is missing. Deployment stopped to protect existing Firebase rules."
            exit 1
          fi

          if [ ! -f firebase.json ]; then
            echo "::error::firebase.json is missing."
            exit 1
          fi

          node -e "const c=require('./firebase.json'); if (!c.firestore || c.firestore.rules !== 'firestore.rules') { console.error('firebase.json must point to firestore.rules.'); process.exit(1); }"

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy reviewed Firestore rules
        run: firebase deploy --only firestore:rules --project homeutensils-5b3cf
